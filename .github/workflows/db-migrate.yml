name: db-migrate

# Applies pending Supabase migrations against prod whenever the prod
# branch advances. Also exposes a manual trigger so a teammate (or
# Claude Code) can re-run on demand without needing local creds.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN     Personal Access Token (sbp_...)
#   NEXT_PUBLIC_SUPABASE_URL  Admin-dash Supabase project URL
#                             (the script derives the project ref from it,
#                             or set SUPABASE_PROJECT_REF directly)

on:
  push:
    branches:
      - claude/dreamme-dashboard-Cut5m
    paths:
      - "supabase/migrations/**"
      - "scripts/apply-migrations.ts"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run db:migrate
